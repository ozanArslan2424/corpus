<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Corpus Docs</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
		/>

		<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
		<link rel="manifest" href="/assets/site.webmanifest" />

		<!-- head -->
	</head>
	<body>
		<nav class="header">
			<a href="/index.html" class="header-brand">
				<img src="/assets/favicon.webp" alt="@ozanarslan/corpus" class="header-logo" />
				<h1>@ozanarslan/corpus</h1>
			</a>

			<div class="header-actions">
				<button
					type="button"
					id="header-menu-toggle"
					aria-label="Toggle menu"
					aria-expanded="false"
				>
					<svg
						width="18"
						height="18"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
					>
						<line x1="3" y1="6" x2="21" y2="6" />
						<line x1="3" y1="12" x2="21" y2="12" />
						<line x1="3" y1="18" x2="21" y2="18" />
					</svg>
				</button>
				<input type="text" id="header-search" placeholder="Search..." readonly />
			</div>
		</nav>

		<dialog id="search-dialog">
			<input type="text" id="search-dialog-input" placeholder="Search..." />
			<ul id="search-results"></ul>
		</dialog>

		<div class="container">
			<aside>
				<nav>
					<!-- sidebar -->
				</nav>
			</aside>

			<main>
				<!-- content -->

				<footer class="site-footer">
					<p>
						&copy; <span id="footer-year"></span> Designed and developed by
						<a href="https://ozanarslan.vercel.app">Ozan Arslan</a>
					</p>
				</footer>
			</main>
		</div>

		<script>
			document.getElementById("footer-year").textContent = new Date().getFullYear();
		</script>
	</body>
</html>
